<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unity Coffee — Order ahead · Demo</title>
<meta name="theme-color" content="#FAF4E8">
<meta name="apple-mobile-web-app-title" content="Unity Coffee">
<meta property="og:title" content="Unity Coffee Cascais — peça antes, sem fila">
<meta property="og:description" content="Menu digital: peça pelo telemóvel, pague online, levante à hora certa. Demo concept.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ikartuzov-hub.github.io/unity-demo/">
<meta property="og:image" content="https://ikartuzov-hub.github.io/unity-demo/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ikartuzov-hub.github.io/unity-demo/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root, [data-theme="light"]{
  --bg:#FAF4E8;            /* крем бумажного меню Unity */
  --bg-2:#FFFFFF;
  --bg-3:#F2EADA;
  --ink:#3E3733;
  --head:#7E2B3D;          /* фирменный бордо Unity */
  --dim:#8D8378;
  --accent:#7E2B3D;
  --accent-soft:rgba(126,43,61,.09);
  --green:#6E9A45;         /* vegan-зелёный из меню */
  --line:rgba(126,43,61,.16);
  --shadow:0 8px 26px rgba(94,31,46,.10);
  --pay-ink:#1C1D1D;
  --logo1:#6C1625;
  --logo2:#9E2B3B;
}
[data-theme="dark"]{
  --bg:#1C1D1D;            /* фирменный тёмный сайта Unity */
  --bg-2:#26282A;
  --bg-3:#2E3134;
  --ink:#D9CDB8;
  --head:#F1E4CC;
  --dim:#9A8F7E;
  --accent:#D98A97;
  --accent-soft:rgba(217,138,151,.10);
  --green:#95BE6C;
  --line:rgba(233,220,197,.14);
  --shadow:0 8px 26px rgba(0,0,0,.45);
  --pay-ink:#111;
  --logo1:#E8D3B8;
  --logo2:#D98A97;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;justify-content:center;min-height:100vh;transition:background .25s,color .25s;
}
.phone{width:100%;max-width:440px;min-height:100vh;position:relative;display:flex;flex-direction:column}

/* ---------- шапка ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.mark{width:34px;height:34px;flex:0 0 auto}
.wordmark{font-family:'Sora',sans-serif;font-weight:800;font-size:16px;line-height:1.05;
  letter-spacing:1.5px;color:var(--head);text-transform:uppercase}
.wordmark small{display:block;font-size:9px;font-weight:600;letter-spacing:2.5px;color:var(--dim)}
.hbtns{display:flex;gap:8px;position:relative}
.rbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:var(--bg-2);color:var(--head);font:700 12px 'Inter';cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.rbtn:active{transform:scale(.92)}
.langmenu{position:absolute;top:46px;right:0;background:var(--bg-2);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden;z-index:40}
.langmenu.open{display:flex}
.langmenu button{border:0;background:transparent;color:var(--ink);font:600 13px 'Inter';
  padding:11px 22px;cursor:pointer;text-align:left}
.langmenu button.on{color:var(--accent);background:var(--accent-soft)}

/* ---------- вау-герой: заказ ко времени ---------- */
.hero{padding:20px 18px 6px}
.hero h1{font-family:'Sora',sans-serif;font-weight:800;font-size:24px;line-height:1.18;color:var(--head)}
.hero p{font-size:13.5px;color:var(--dim);margin-top:7px;line-height:1.5}
.flow{margin:16px 0 4px;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;
  padding:14px 14px 10px;box-shadow:var(--shadow)}
.flow svg{width:100%;height:auto;display:block}
.ready{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;
  font-size:13px;color:var(--dim)}
.ready b{font-family:'Sora',sans-serif;font-size:16px;color:var(--head)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pl 1.6s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
.timechips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.timechips button, .timechips input{
  border:1px solid var(--line);background:var(--bg-2);color:var(--ink);
  font:600 12.5px 'Inter';padding:9px 13px;border-radius:12px;cursor:pointer}
.timechips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.timechips input{width:96px;color:var(--head);font-weight:700}

.heroimg{width:100%;height:180px;object-fit:cover;border-radius:18px;margin-top:16px;
  box-shadow:var(--shadow);display:block}
.thumb{width:66px;height:66px;border-radius:12px;object-fit:cover;flex:0 0 auto}
/* ---------- категории ---------- */
nav.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 12px;scrollbar-width:none;
  position:sticky;top:69px;z-index:25;background:var(--bg)}
nav.cats::-webkit-scrollbar{display:none}
nav.cats button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg-2);color:var(--dim);
  font:600 12.5px 'Inter';padding:8px 14px;border-radius:999px;cursor:pointer;transition:.15s}
nav.cats button.on{background:var(--head);color:var(--bg);border-color:var(--head)}

/* ---------- меню ---------- */
main{flex:1;padding:0 18px 130px}
.section-t{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--head);margin:20px 0 3px}
.section-sub{font-size:12px;color:var(--dim);margin-bottom:12px}
.card{display:flex;justify-content:space-between;gap:12px;background:var(--bg-2);
  border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:9px}
.card h3{font-size:14px;font-weight:600;color:var(--ink)}
.card .desc{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.45}
.tags{display:inline-flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  border-radius:5px;padding:2.5px 7px;border:1px solid var(--line);color:var(--dim)}
.tag.hit{color:var(--accent);border-color:var(--accent)}
.tag.vegan{color:var(--green);border-color:var(--green)}
.tag.new{color:var(--head);border-color:var(--head)}
.card .right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}
.price{font-size:14px;font-weight:700;color:var(--head);white-space:nowrap}
.add{border:0;background:var(--head);color:var(--bg);width:32px;height:32px;border-radius:10px;
  font-size:18px;font-weight:600;cursor:pointer;transition:.12s}
.add:active{transform:scale(.9)}
.add.in{background:var(--green);color:#fff}
.note{font-size:11px;color:var(--dim);margin:4px 0 0;font-style:italic}

/* ---------- корзина-бар ---------- */
.cartbar{position:fixed;left:50%;transform:translateX(-50%) translateY(150%);bottom:18px;
  width:calc(100% - 32px);max-width:408px;z-index:35;background:var(--head);color:var(--bg);
  border-radius:16px;display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.2,.4,1);
  box-shadow:var(--shadow)}
.cartbar.show{transform:translateX(-50%) translateY(0)}
.cartbar b{font-size:14.5px}.cartbar .sum{font-size:15px;font-weight:700}

/* ---------- шторка заказа ---------- */
.sheet{position:fixed;inset:0;z-index:45;display:none;justify-content:center;align-items:flex-end;
  background:rgba(28,29,29,.55);backdrop-filter:blur(2px)}
.sheet.open{display:flex}
.panel{width:100%;max-width:440px;background:var(--bg);border-radius:22px 22px 0 0;
  padding:22px 20px 34px;border-top:1px solid var(--line);max-height:88vh;overflow-y:auto;
  animation:up .25s cubic-bezier(.3,1.1,.4,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel h2{font-family:'Sora',sans-serif;font-weight:700;font-size:19px;color:var(--head);margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:13.5px}
.row .qty{display:flex;align-items:center;gap:10px}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg-2);color:var(--ink);font-size:15px;cursor:pointer}
.opt-t{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
.total-row{display:flex;justify-content:space-between;font-size:16px;font-weight:700;color:var(--head);margin:16px 0 6px}
.readyline{font-size:12.5px;color:var(--dim);margin-bottom:14px}
.readyline b{color:var(--green)}
.paybtns{display:grid;gap:9px}
.paybtns button{border:0;border-radius:13px;padding:14px;font:600 14px 'Inter';cursor:pointer}
.pay-apple{background:var(--pay-ink);color:#fff}
.pay-mb{background:#D60510;color:#fff}
.pay-card{background:var(--head);color:var(--bg)}
.hint{font-size:11px;color:var(--dim);text-align:center;margin-top:12px;line-height:1.55}

/* ---------- успех ---------- */
.success{position:fixed;inset:0;z-index:55;background:var(--bg);display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.success.open{display:flex}
.mark-ok{width:76px;height:76px;border-radius:50%;background:rgba(110,154,69,.13);
  display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--green);
  border:2px solid var(--green);margin-bottom:18px;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.success h2{font-family:'Sora',sans-serif;font-size:23px;color:var(--head);margin-bottom:6px}
.success .no{font-size:13px;color:var(--dim);margin-bottom:8px}
.success .bigtime{font-family:'Sora',sans-serif;font-size:30px;font-weight:800;color:var(--green);margin-bottom:24px}
.timeline{display:flex;flex-direction:column;text-align:left;width:100%;max-width:260px}
.step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:20px}
.step:last-child{padding-bottom:0}
.step .dot{width:12px;height:12px;border-radius:50%;background:var(--bg-3);
  border:2px solid var(--dim);margin-top:2px;flex:0 0 auto}
.step.done .dot{background:var(--green);border-color:var(--green)}
.step .l{font-size:13px;color:var(--dim)}
.step.done .l{color:var(--ink);font-weight:600}
.step::before{content:'';position:absolute;left:5px;top:16px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.sbtns{display:flex;gap:10px;margin-top:32px}
.sbtns button{border:1px solid var(--line);background:var(--bg-2);color:var(--ink);
  font:600 13px 'Inter';padding:12px 20px;border-radius:12px;cursor:pointer}
.sbtns .share{background:var(--head);color:var(--bg);border-color:var(--head)}

/* ---------- демо-плашка + футер ---------- */
.demo-badge{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--head);color:var(--bg);font:700 9.5px 'Inter';letter-spacing:1.4px;
  padding:3px 15px;border-radius:0 0 8px 8px;text-transform:uppercase}
.ownerbox{margin:8px 18px 0;padding:20px 18px;text-align:center;background:var(--bg-2);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.ownerbox p{font-family:'Sora',sans-serif;font-weight:700;font-size:17px;color:var(--head);
  margin-bottom:14px;line-height:1.3}
.ownerbtn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
  font-family:'Sora',sans-serif;font-weight:700;font-size:15px;padding:12px 26px;border-radius:12px;
  transition:.15s}
.ownerbtn:active{transform:scale(.96)}
.subsidy-note{display:block;font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:14px;
  max-width:360px;margin-left:auto;margin-right:auto}
footer{padding:30px 18px 64px;text-align:center;font-size:15px;color:var(--dim);line-height:1.6}
footer a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);
  text-underline-offset:4px;display:inline-block;padding:8px 4px}
footer .demo-note{display:block;font-size:11px;margin-top:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="demo-badge" id="demoBadge">Demo</div>
<div class="phone">

<header>
  <a class="brand" href="#">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M46 4 H26 A22 22 0 0 0 4 26 V46 H46 Z" fill="var(--logo1)"/>
      <path d="M54 4 H68 A28 28 0 0 1 96 32 V46 H54 Z" fill="var(--logo1)"/>
      <rect x="54" y="54" width="42" height="42" rx="15" fill="var(--logo2)"/>
      <path d="M4 54 H46 V96 H32 A28 28 0 0 1 4 68 Z" fill="var(--logo1)"/>
    </svg>
    <span class="wordmark">Unity<br>Coffee<small id="locLine">Cascais · Av. 25 de Abril 181</small></span>
  </a>
  <div class="hbtns">
    <button class="rbtn" id="langBtn" aria-label="Language">PT</button>
    <button class="rbtn" id="themeBtn" aria-label="Theme">☾</button>
    <div class="langmenu" id="langMenu"></div>
  </div>
</header>

<section class="hero">
  <h1 id="hTitle"></h1>
  <p id="hSub"></p>

  <img id="heroImg" class="heroimg" alt="Unity Coffee — syrniki">

  <!-- вау-механика: живой поток телефон → чашка -->
  <div class="flow">
    <svg viewBox="0 0 360 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- телефон -->
      <rect x="14" y="22" width="30" height="52" rx="7" fill="none" stroke="var(--head)" stroke-width="2.5"/>
      <line x1="24" y1="66" x2="34" y2="66" stroke="var(--head)" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="20" y="30" width="18" height="4" rx="2" fill="var(--accent)" opacity=".8"/>
      <rect x="20" y="38" width="18" height="4" rx="2" fill="var(--accent)" opacity=".5"/>
      <rect x="20" y="46" width="12" height="4" rx="2" fill="var(--accent)" opacity=".3"/>
      <!-- маршрут -->
      <path id="route" d="M52 48 C 120 10, 240 86, 306 50" fill="none"
        stroke="var(--line)" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>
      <!-- бегущее зерно -->
      <circle r="5" fill="var(--accent)">
        <animateMotion dur="2.6s" repeatCount="indefinite" rotate="auto">
          <mpath href="#route"/>
        </animateMotion>
      </circle>
      <circle r="5" fill="var(--accent)" opacity=".35">
        <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" rotate="auto">
          <mpath href="#route"/>
        </animateMotion>
      </circle>
      <!-- чашка -->
      <path d="M312 44 h30 v14 a15 15 0 0 1 -30 0 z" fill="none" stroke="var(--head)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M342 47 h5 a6 6 0 0 1 0 12 h-4" fill="none" stroke="var(--head)" stroke-width="2.5"/>
      <line x1="309" y1="80" x2="348" y2="80" stroke="var(--head)" stroke-width="2.5" stroke-linecap="round"/>
      <!-- пар -->
      <path d="M321 36 q3 -5 0 -10" stroke="var(--dim)" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8">
        <animate attributeName="opacity" values=".8;.15;.8" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M331 36 q-3 -5 0 -10" stroke="var(--dim)" stroke-width="2" fill="none" stroke-linecap="round" opacity=".4">
        <animate attributeName="opacity" values=".3;.85;.3" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </svg>
    <div class="ready"><span class="pulse"></span><span id="readyLbl"></span>&nbsp;<b id="readyTime">—</b></div>
  </div>

  <div class="timechips" id="timeChips"></div>
</section>

<nav class="cats" id="cats"></nav>
<main id="menu"></main>

<div class="cartbar" id="cartbar" onclick="openCart()">
  <b id="cbLabel"></b><span class="sum" id="cbSum"></span>
</div>

<div class="sheet" id="cartSheet" onclick="if(event.target===this)closeCart()">
  <div class="panel">
    <h2 id="ctTitle"></h2>
    <div id="cartRows"></div>
    <div class="opt-t" id="ctWhen"></div>
    <div class="timechips" id="timeChips2"></div>
    <div class="total-row"><span id="ctTotalL"></span><span id="ctTotalV"></span></div>
    <div class="readyline" id="ctReady"></div>
    <div class="paybtns">
      <button class="pay-apple" onclick="pay()"> Pay</button>
      <button class="pay-mb" onclick="pay()">MB WAY</button>
      <button class="pay-card" onclick="pay()" id="payCardBtn"></button>
    </div>
    <div class="hint" id="ctHint"></div>
  </div>
</div>

<div class="success" id="success">
  <div class="mark-ok">✓</div>
  <h2 id="sTitle"></h2>
  <div class="no" id="sNo">Unity Coffee Cascais · #U-1047</div>
  <div class="bigtime" id="sTime">—</div>
  <div class="timeline" id="sTimeline"></div>
  <div class="sbtns">
    <button class="share" id="shareBtn" onclick="shareIt()"></button>
    <button onclick="reset()" id="sAgain"></button>
  </div>
</div>

<div class="ownerbox">
  <p id="ownerQ"></p>
  <a class="ownerbtn" id="ownerBtn" href="https://t.me/SeedWaveBot" target="_blank" rel="noopener"></a>
  <span class="subsidy-note" id="subsidyNote"></span>
</div>
<footer>
  © <span id="yr"></span> <a href="https://ikartuzov-hub.github.io/seedwave-catalog/hub/" id="hubLink">SeedWave</a> · <a href="https://www.linkedin.com/in/igor-kartuzov" id="liLink">Igor Kartuzov</a>
  <span class="demo-note" id="footNote"></span>
</footer>
</div>

y9gia6fJG4WtaEU9qcmhOCBQVIRpOExg3ynEkjJOUCgJQ1IFKxoKK//9k="
};

/* фото → позиции меню (контент-слой) */
const ITEM_PHOTO={'hot_3':'flatwhite','breakfast_0':'syrniki','breakfast_2':'tofniki','breakfast_11':'gravlax','brunch_1':'quinoa'};

/* ================================================================
   СЛОЙ 1 — ДВИЖОК · ничего не знает о конкретном языке и меню
   ================================================================ */
const qs = new URLSearchParams(location.search);
let lang = qs.get('lang') || 'pt'; if(!UI[lang]) lang='pt';
let theme = qs.get('theme') || localStorage.getItem('uc_theme') || 'light';
let cart = {}, activeCat = 'hot', when = 'asap', customT = '';

const $=id=>document.getElementById(id);
const t=()=>UI[lang];
const pick=v=>typeof v==='string'?v:(v[lang]||v.en);
const fmt=v=>typeof v==='number'?'€'+v.toFixed(2).replace('.',','):'€'+v;

/* тема */
function applyTheme(){
  document.documentElement.dataset.theme=theme;
  $('themeBtn').textContent = theme==='light'?'☾':'☀';
  localStorage.setItem('uc_theme',theme);
}
$('themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';applyTheme()};

/* язык — круглая кнопка + выпадашка 5 языков */
function renderLangMenu(){
  $('langBtn').textContent=lang.toUpperCase();
  $('langMenu').innerHTML=LANGS.map(l=>
    `<button class="${l===lang?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('');
}
$('langBtn').onclick=e=>{e.stopPropagation();$('langMenu').classList.toggle('open')};
document.addEventListener('click',()=>$('langMenu').classList.remove('open'));
function setLang(l){lang=l;renderAll()}

/* время готовности */
function readyAt(){
  const now=new Date();
  if(when==='custom'&&customT){
    const [h,m]=customT.split(':');const d=new Date();d.setHours(+h,+m,0,0);return d;
  }
  const add=when==='m20'?20:when==='m30'?30:10;
  return new Date(now.getTime()+add*60000);
}
const hhmm=d=>d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
function renderReady(){
  const s=hhmm(readyAt());
  $('readyTime').textContent=s;$('readyLbl').textContent=t().ready;
  $('ctReady').innerHTML=t().readyline+' <b>'+s+'</b>';
}
function timeChipsHtml(){
  return `<button class="${when==='asap'?'on':''}" onclick="setWhen('asap')">${t().asap}</button>
  <button class="${when==='m20'?'on':''}" onclick="setWhen('m20')">${t().m20}</button>
  <button class="${when==='m30'?'on':''}" onclick="setWhen('m30')">${t().m30}</button>
  <input type="time" value="${customT}" onclick="event.stopPropagation()"
     onchange="customT=this.value;setWhen('custom')" aria-label="${t().pick}">`;
}
function setWhen(w){when=w;renderWhenAll()}
function renderWhenAll(){
  $('timeChips').innerHTML=timeChipsHtml();
  $('timeChips2').innerHTML=timeChipsHtml();
  renderReady();
}

/* категории и меню */
function renderCats(){
  $('cats').innerHTML=CATS.map(k=>
    `<button class="${k===activeCat?'on':''}" onclick="setCat('${k}')">${t().cats[k]}</button>`).join('');
}
function setCat(k){activeCat=k;renderCats();renderMenu();
  document.querySelector('main').scrollIntoView({behavior:'smooth'})}
const iid=(c,i)=>c+'_'+i;
function renderMenu(){
  let html='';
  const order=[activeCat,...CATS.filter(k=>k!==activeCat)];
  for(const cat of order){
    html+=`<div class="section-t">${t().cats[cat]}</div><div class="section-sub">${t().subs[cat]}</div>`;
    MENU[cat].forEach((it,i)=>{
      const id=iid(cat,i),q=cart[id]||0;
      const ph=ITEM_PHOTO[id];
      html+=`<div class="card">${ph?`<img class="thumb" loading="lazy" src="${PHOTOS[ph]}" alt="">`:''}<div style="flex:1;min-width:0">
        <h3>${pick(it.n)}</h3><div class="desc">${pick(it.d)}</div>
        ${it.tag?`<span class="tags"><span class="tag ${it.tag}">${t().tags[it.tag]}</span></span>`:''}
      </div><div class="right">
        <span class="price">${fmt(it.p)}</span>
        <button class="add ${q?'in':''}" onclick="add('${cat}',${i})" aria-label="add">${q||'+'}</button>
      </div></div>`;
    });
  }
  $('menu').innerHTML=html;
}
function num(p){return typeof p==='number'?p:parseFloat(p)||0}
function add(c,i){const id=iid(c,i);cart[id]=(cart[id]||0)+1;renderMenu();renderCartbar()}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];
  renderMenu();renderCartbar();renderRows();
  if(!Object.keys(cart).length)closeCart()}
const items=()=>Object.entries(cart).map(([id,q])=>{const [c,i]=id.split('_');return{id,q,it:MENU[c][+i]}});
const total=()=>items().reduce((s,x)=>s+num(x.it.p)*x.q,0);
function renderCartbar(){
  const arr=items(),bar=$('cartbar');
  if(!arr.length){bar.classList.remove('show');return}
  bar.classList.add('show');
  $('cbLabel').textContent=t().cart+' · '+arr.reduce((s,x)=>s+x.q,0);
  $('cbSum').textContent=fmt(total());
}
function renderRows(){
  $('cartRows').innerHTML=items().map(x=>
    `<div class="row"><span>${pick(x.it.n)}</span><span class="qty">
     <button onclick="chg('${x.id}',-1)">−</button><b>${x.q}</b><button onclick="chg('${x.id}',1)">+</button>
     <span style="min-width:56px;text-align:right;font-weight:700">${fmt(num(x.it.p)*x.q)}</span>
    </span></div>`).join('');
  $('ctTotalV').textContent=fmt(total());
}
function openCart(){renderRows();renderWhenAll();$('cartSheet').classList.add('open')}
function closeCart(){$('cartSheet').classList.remove('open')}

/* оплата-заглушка + успех */
function pay(){
  closeCart();
  $('sTime').textContent=hhmm(readyAt());
  $('success').classList.add('open');
  const st=t().steps;
  $('sTimeline').innerHTML=st.map((s,i)=>
    `<div class="step" id="st${i}"><span class="dot"></span><span class="l">${s}</span></div>`).join('');
  st.forEach((_,i)=>setTimeout(()=>{const e=$('st'+i);if(e)e.classList.add('done')},500+i*900));
}
function reset(){cart={};$('success').classList.remove('open');renderAll()}

/* виральный контур: share на экране результата */
async function shareIt(){
  const text=t().shareText+' '+location.href.split('?')[0]+'?lang='+lang;
  if(navigator.share){try{await navigator.share({text})}catch(e){}}
  else{try{await navigator.clipboard.writeText(text);
    $('shareBtn').textContent=t().copied;
    setTimeout(()=>$('shareBtn').textContent=t().share,1800)}catch(e){}}
}

/* статические строки */
function renderStatic(){
  $('hTitle').textContent=t().hTitle;$('hSub').textContent=t().hSub;
  $('ctTitle').textContent=t().order;$('ctWhen').textContent=t().when;
  $('ctTotalL').textContent=t().total;$('payCardBtn').textContent=t().payCard;
  $('ctHint').textContent=t().hint;$('sTitle').textContent=t().done;
  $('sAgain').textContent=t().again;$('shareBtn').textContent=t().share;
  $('demoBadge').textContent=t().badge;$('footNote').textContent=t().footNote;
  $('ownerQ').textContent=t().ownerQ;$('ownerBtn').textContent=t().ownerBtn;$('subsidyNote').textContent=t().subsidy;
  document.documentElement.lang=lang;
  /* язык едет сквозь ссылки экосистемы */
  $('hubLink').href='https://ikartuzov-hub.github.io/seedwave-catalog/hub/?lang='+lang+'&theme='+theme;
}
function renderAll(){renderLangMenu();renderCats();renderMenu();renderCartbar();renderWhenAll();renderStatic()}
$('yr').textContent=new Date().getFullYear();
$('heroImg').src=PHOTOS.hero;
applyTheme();renderAll();
/* тикающее «готов к …» */
setInterval(renderReady,30000);
</script>
</body>
</html>
